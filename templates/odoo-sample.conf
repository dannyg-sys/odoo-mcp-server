[options]
; ===========================================================================
; SAMPLE project config. Copy to odoo-<project>.conf, then:
;   - set db_name to your project's database
;   - replace SAMPLE in addons_path with the project's addon dir (the symlink
;     ~/odoo/<project> -> ~/git/<repo>)
;   - for Odoo 19, uncomment the _odoo19 / _enterprise19 / _venv19 lines below
; Activate it with:  odoo switch <project>
; ===========================================================================

; -- Version selection (read by manage_odoo.sh) --
; Defaults are _odoo18 / _venv18 when these markers are absent (Odoo 18).
; Uncomment both for Odoo 19:
; odoo_src = _odoo19
; python_venv = _venv19

; General Settings
admin_passwd = admin
db_name = SAMPLE
db_host = localhost
db_port = 5432
db_user = odoo
db_password =
http_port = 8069

; addons_path = core addons + (enterprise) + this project's addon dir.
; Odoo 18 (default):
addons_path = ./_odoo18/addons,./_enterprise18,./SAMPLE
; Odoo 19 (use instead of the line above):
; addons_path = ./_odoo19/addons,./_enterprise19,./SAMPLE

data_dir = ./_data
filestore = ./_data/filestore

; Features
unaccent = True
list_db = False
proxy_mode = True

; Logging
log_level = info
